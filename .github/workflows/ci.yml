name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

# Same branch pe naya push aaye to purana run cancel ho jaye.
# Bina iske teen tez commits = chhe parallel runs, sab purane bekaar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Default token ko zyada access milta hai; CI ko sirf
# code padhna hai.
permissions:
  contents: read

jobs:
  checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    # Hang hone par GitHub ka default 6 GHANTE hai — utne minutes jal jayenge.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # npm ci `prepare` chalata hai -> husky. CI me git hooks bekaar hain.
          HUSKY: 0

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:verify
